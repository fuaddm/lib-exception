spring:
  main:
    web-application-type: none
    banner-mode: off
  cloud:
    vault:
      uri: ${VAULT_URI}
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID}
        secret-id: ${VAULT_SECRET_ID}
      kv:
        enabled: true
        backend: secret
        backend-version: 2
  config:
    # KV v2 backend "secret" (above) + context "nexus" below resolves to the
    # same secret/data/nexus path the old curl/Invoke-RestMethod calls read.
    import: "vault://nexus"

logging:
  level:
    root: WARN
