plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
}

description = 'Fetches the Nexus deployer credentials from Vault (AppRole auth, ' +
        'Spring Cloud Vault) and prints them for the root build.gradle\'s ' +
        '`fetchNexusCredentialsFromVault` task to feed into `./gradlew publish`. ' +
        'Not published, no main-jar of its own - always run forked (JavaExec) ' +
        'straight off this module\'s compiled classes. See ' +
        '../docs/publishing.md and ../docs/design-decisions.md.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.1.2")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.cloud:spring-cloud-starter-vault-config'
}
